name: Package App
on:
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - platform: 'windows/amd64'
            os: 'windows-latest'
          - platform: 'darwin/universal'
            os: 'macos-latest'
    runs-on: ${{ matrix.build.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build Wails
        uses: dAppServer/wails-build-action@v2.2
        id: build
        with:
          build-name: KeyExport
          build-platform: ${{ matrix.build.platform }}
          package: false
          go-version: '1.25'

      - uses: actions/upload-artifact@v4
        with:
          name: KeyExport-${{ runner.os }}
          path: |
            build/bin/*
            !**/*.zip