version: 3

tasks:
  init-wails:
    cmd: |
      go install github.com/wailsapp/wails/v2/cmd/wails@v2.10

  build-keypair:
    deps:
      - init-wails
    dir: apps/keypair
    cmd: |
      export PATH=$PATH:$(go env GOPATH)/bin
      wails build

  build-restore:
    deps:
      - init-wails
    dir: apps/restore
    cmd: |
      export PATH=$PATH:$(go env GOPATH)/bin
      wails build

  build:
    deps:
      - build-keypair
      - build-restore

  test:
    deps:
      - build
    cmd: |
      go test -json ./...

  run-keypair:
    deps:
      - build-keypair
    dir: apps/keypair
    cmd: |
      export PATH=$PATH:$(go env GOPATH)/bin
      wails dev

  run-restore:
    deps:
      - build-restore
    dir: apps/restore
    cmd: |
      export PATH=$PATH:$(go env GOPATH)/bin
      wails dev
