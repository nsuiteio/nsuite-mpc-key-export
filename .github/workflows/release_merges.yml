name: Release merged
on:
  pull_request:
    branches:
      - main
    types: [closed]
env:
  BASE_NAME: ${{ github.head_ref }}
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      matrix:
        build:
          - platform: 'windows/amd64'
            os: 'windows-latest'
          - platform: 'darwin/universal'
            os: 'macos-latest'
    runs-on: ${{ matrix.build.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wails app
        run: task build

      # アプリ分割後は成果物が apps/*/build/bin に出力される。
      # リリース tar の構成を従来どおり平坦に保つため1箇所へ集約する。
      # 成果物名は wails.json の outputfilename で KeyPairGenerator /
      # KeyRestore と分かれているため集約しても衝突しない。
      # upload-artifact の if-no-files-found では「片方だけ空」を検出できない
      # ので、アプリ単位で成果物の存在を確認する
      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p dist
          for app in keypair restore; do
            src="apps/$app/build/bin"
            if [ -z "$(find "$src" -mindepth 1 -print -quit 2>/dev/null)" ]; then
              echo "::error::$src に成果物がありません"
              exit 1
            fi
            cp -R "$src/." dist/
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: KeyExport-${{ runner.os }}
          path: |
            dist/*
          # 成果物が空のままリリースが作られるのを防ぐ
          if-no-files-found: error

  draft_release:
    needs: build
    if: ${{ github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: tibdex/github-app-token@v2
        id: generate_token
        with:
          app_id: ${{ secrets.ACTIONS_SUPPORTER_APP_ID }}
          private_key: ${{ secrets.ACTIONS_SUPPORTER_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Set tag name
        run: |
          version=${BASE_NAME#release/}
          echo "version=$version"
          echo "TAG_NAME=$version" >> $GITHUB_ENV

      - name: Setup git config
        run: |
          git config --global user.email "devel@nsuite.io"
          git config --global user.name "GitHub Actions"

      - name: merge to develop
        run: |
          git checkout -t origin/develop
          git merge --no-edit --no-ff main
          git push
          git checkout main

      - name: Tag version
        run: |
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - uses: actions/download-artifact@v4
      - name: Archive
        run: |
          ls -la *
          for dir in KeyExport-*
          do
            target=$(basename $dir).tar.gz
            echo "making $target"
            pushd $dir
            for file in $(find . -type f)
            do
              ls -la $file
              chmod +x $file
            done
            tar czf ../$target *
            popd
          done
          ls -la *

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          draft: true
          generate_release_notes: true
          files: KeyExport-*.tar.gz