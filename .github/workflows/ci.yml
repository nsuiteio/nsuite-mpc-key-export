name: CI
on: [pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # @latest はツール側の go 要求バージョンが上がった時点で CI を止める。
      # x/tools v0.50.0（2026-09-08 公開）が go>=1.26 を要求して実際に発火し、
      # GOTOOLCHAIN=local のため toolchain を上げられず format が失敗した。
      # goimports はどこからも呼ばれていなかったため削除している
      # （Check format は golines のみ、golines が内部で呼ぶのは gofmt）
      - name: Install formatters
        run: |
          go install github.com/segmentio/golines@v0.13.0
      - name: Check format
        run: if [ "$((golines --max-len=80 --dry-run . | tee /dev/stderr) | wc -l)" -gt 0 ]; then exit 1; fi

  lint:
    runs-on: ubuntu-arm64-2core
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wails app
        run: |
          sudo apt-get update
          sudo apt-get install libgtk-3-dev libwebkit2gtk-4.0-dev
          task build

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

  test:
    runs-on: ubuntu-arm64-2core
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wails app
        run: |
          sudo apt-get update
          sudo apt-get install libgtk-3-dev libwebkit2gtk-4.0-dev
          task build

      - name: Run Test
        run: go test -p 1 -json ./... | tee test-reports.json
      - name: Annotate test-reports
        if: always()
        uses: guyarb/golang-test-annotations@v0.8.0
        with:
          test-results: test-reports.json
